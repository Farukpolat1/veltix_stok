test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Production — Cloudflare R2 (S3 API uyumlu, Amazon'a bağımlı değiliz).
# GEMINI_API_KEY/RESEND_API_KEY gibi diğer tüm sırlar da ENV üzerinden
# geliyor (bkz. .env.example), bu yüzden Rails credentials yerine ENV
# kullanılıyor. Yarın başka bir S3 uyumlu servise (Backblaze B2, gerçek AWS
# S3 vb.) geçilirse sadece bu üç env değişkeninin değerleri değişir, kod
# aynı kalır.
cloud:
  service: S3
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("R2_REGION", "auto") %>
  bucket: <%= ENV["R2_BUCKET"] %>
  # R2 (ve genel olarak S3 uyumlu servisler), gerçek AWS S3'ten farklı olarak
  # kendi endpoint adresini ister. Gerçek AWS S3'e geçilirse R2_ENDPOINT boş
  # bırakılabilir (AWS'in kendi varsayılan adresini kullanır).
  <% if ENV["R2_ENDPOINT"].present? %>
  endpoint: <%= ENV["R2_ENDPOINT"] %>
  force_path_style: true
  <% end %>
