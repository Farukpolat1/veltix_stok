  # DemoRequest, ActiveRecord olmayan (ActiveModel::Model) bir form nesnesi —
  # hata mesajı ararken activerecord: değil, activemodel: veya en sonunda
  # üstteki genel errors: anahtarına bakar, bu yüzden aynı mesajlar burada da
  # tekrarlanıyor (bkz. errors.messages altında). SupportRequest artık gerçek
  # bir ActiveRecord modeli olduğu için üstteki activerecord.attributes içinde.
  activemodel:
    attributes:
      demo_request:
        name: "Ad Soyad"
        email: "E-posta"
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "boş bırakılamaz"
      taken: "zaten kullanılıyor"
      invalid: "geçerli değil"
      not_a_number: "sayı olmalıdır"
      greater_than: "%{count} değerinden büyük olmalıdır"
      greater_than_or_equal_to: "%{count} değerinden büyük veya eşit olmalıdır"
      less_than: "%{count} değerinden küçük olmalıdır"
      less_than_or_equal_to: "%{count} değerinden küçük veya eşit olmalıdır"
      confirmation: "eşleşmiyor"
      too_short: "en az %{count} karakter olmalıdır"
      too_long: "en fazla %{count} karakter olmalıdır"
      record_invalid: "Doğrulama başarısız: %{errors}"
  date:
    formats:
      default: "%d.%m.%Y"
  time:
    formats:
      default: "%d.%m.%Y %H:%M"